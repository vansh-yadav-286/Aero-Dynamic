name: Node.js CI

on:
  push:
    branches: [ "main", "fix/authentication-rbac", "fix/risk-dispatch-consistency" ]
  pull_request:
    branches: [ "main", "fix/authentication-rbac" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    - name: Run Unit Tests
      run: npm test

    - name: Build Project
      run: npm run build
